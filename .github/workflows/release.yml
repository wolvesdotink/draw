# =============================================================================
# release.yml — build and publish a signed, notarized macOS .dmg + updater
#               manifest to a GitHub Release.
# =============================================================================
#
# TRIGGERS
#   - push to a version tag `v*` (e.g. v0.2.0 or v0.2.1-beta.1) → publish release
#   - workflow_dispatch (manual run from the Actions tab)       → draft only
#
# CHANNELS
#   A tag containing `-beta.` publishes as a GitHub prerelease and also pushes
#   a rolling `beta.json` to the `manifests` branch. Plain `vX.Y.Z` tags are
#   stable. A prerelease is never GitHub's "latest", so the in-app updater
#   (reads /releases/latest/.../latest.json) only ever sees stable releases.
#
# WHAT IT BUILDS
#   - draw_<version>_universal.dmg           (Apple Silicon + Intel fat binary)
#   - draw.app.tar.gz + draw.app.tar.gz.sig  (updater payload + signature)
#   - latest.json                            (updater manifest consumed by the
#                                             in-app `tauri-plugin-updater`)
#
# DESIGN NOTE: split build from publish
#   `tauri-action` builds, signs, and notarizes — but we do NOT let it publish.
#   Instead, the publish step uses `softprops/action-gh-release` which creates
#   the GitHub Release with all assets in one atomic API call. This is
#   compatible with GitHub's Immutable Releases feature, where a release is
#   frozen the moment it's created and assets cannot be added afterward.
#
# DISTRIBUTION URLS (set up by GitHub automatically)
#   - direct dmg : https://github.com/wolvesdotink/draw/releases/latest/download/draw_<version>_universal.dmg
#                  (note: <version> changes per release; use the URL below for a stable link)
#   - latest dmg : https://github.com/wolvesdotink/draw/releases/latest/download/draw.dmg
#                  (we publish an aliased copy named exactly draw.dmg so the
#                   marketing site can hard-code one URL forever)
#   - manifest   : https://github.com/wolvesdotink/draw/releases/latest/download/latest.json
#
# REQUIRED REPO SECRETS  (Settings → Secrets and variables → Actions)
#   Apple code-signing + notarization:
#     APPLE_CERTIFICATE              base64 of your Developer ID .p12
#     APPLE_CERTIFICATE_PASSWORD     password for that .p12
#     APPLE_SIGNING_IDENTITY         "Developer ID Application: <Name> (TEAMID)"
#     APPLE_ID                       your Apple ID email
#     APPLE_PASSWORD                 app-specific password (appleid.apple.com → Sign-In and Security → App-Specific Passwords)
#     APPLE_TEAM_ID                  10-character team id
#
#   Tauri updater signing (separate from Apple, signs the .tar.gz):
#     TAURI_SIGNING_PRIVATE_KEY      contents of .secrets/updater.key
#     TAURI_SIGNING_PRIVATE_KEY_PASSWORD   blank if generated without password
#
#   GITHUB_TOKEN is provided automatically; no setup needed.
# =============================================================================

name: release

on:
  push:
    tags:
      # `v*` (not `v*.*.*`) so we also match prerelease tags like
      # `v0.2.10-beta.1`. Whether a run publishes as prerelease or stable is
      # decided by the `tagmeta` step below from the tag itself.
      - "v*"
  workflow_dispatch:

# Cancel in-flight runs on the same ref so a quick re-tag doesn't queue duplicates.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Only publishing-the-release needs `contents: write`. Everything else stays read.
permissions:
  contents: write

jobs:
  release:
    name: Build & publish (macOS universal)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags so "Generate release notes" can
          # `git log <prev-stable>..<tag>` and resolve the previous stable tag.
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm 10
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # We build a single universal-apple-darwin binary that runs natively on
      # both Apple Silicon and Intel. Rust toolchain needs both target stdlibs.
      - name: Setup Rust (universal apple-darwin targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Set up the signing keychain ourselves so it persists across steps.
      # If we let tauri-action handle the cert (by passing APPLE_CERTIFICATE),
      # it creates a throwaway keychain that isn't in codesign's search list
      # by the time the "Re-codesign DMG" step runs — failing with
      # "The specified item could not be found in the keychain."
      - name: Setup Apple signing keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_P12="$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo -n "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_P12"
          security import "$CERT_P12" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERT_P12"

          # Allow codesign to use the key without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null

          # Prepend our keychain to the user search list (keep existing entries).
          security list-keychain -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychain -d user | sed -E 's/^[[:space:]]*"|"[[:space:]]*$//g' | tr '\n' ' ')

          echo "Available codesigning identities:"
          security find-identity -v -p codesigning

      # tauri-action without `tagName` does NOT create a GitHub Release — it
      # just runs the build/sign/notarize/updater-sign pipeline. We publish
      # ourselves below so the release is born complete (Immutable-safe).
      #
      # NOTE: APPLE_CERTIFICATE/APPLE_CERTIFICATE_PASSWORD are intentionally
      # NOT passed here — the keychain is set up in the previous step so it
      # survives for the later "Re-codesign DMG" step.
      - name: Build, sign, notarize
        uses: tauri-apps/tauri-action@v0
        env:
          # Apple code-signing identity (cert already in our keychain).
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Apple notarization (legacy Apple-ID method; switch to API key
          # secrets if you'd rather use App Store Connect API keys).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Tauri updater payload signing (separate from Apple).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target universal-apple-darwin

      # tauri-action gives the DMG a generic Finder icon. Re-author the DMG
      # with a custom volume icon (.VolumeIcon.icns + the 'C' Finder flag),
      # then re-codesign and re-notarize. Tauri v2 has no config knob for
      # this yet — see tauri-apps/tauri#9253.
      #
      # Pipeline (each stage fails the workflow if it errors):
      #   convert UDZO → UDRW (writable)
      #   mount, install icon, set 'C' attribute, detach
      #   convert UDRW → UDZO (Finder reads the icon from the compressed image)
      #   codesign --force (the previous Apple signature is now invalid)
      #   notarytool submit --wait + stapler staple
      - name: Add custom DMG volume icon (re-sign + re-notarize)
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          BUNDLE_DMG_DIR="src-tauri/target/universal-apple-darwin/release/bundle/dmg"
          DMG="${BUNDLE_DMG_DIR}/draw_${VERSION}_universal.dmg"
          ICON="src-tauri/icons/icon.icns"
          MOUNT="/Volumes/draw-iconize-$$-${RANDOM}"
          RW_DMG="${BUNDLE_DMG_DIR}/draw_${VERSION}_universal.rw.dmg"

          test -f "$DMG"  || { echo "::error::source dmg not found: $DMG"; exit 1; }
          test -f "$ICON" || { echo "::error::icon not found: $ICON"; exit 1; }

          cleanup() {
            if mount | grep -q " on ${MOUNT} "; then
              hdiutil detach "$MOUNT" -force >/dev/null 2>&1 || true
            fi
            rm -f "$RW_DMG"
          }
          trap cleanup EXIT

          echo "::group::Convert UDZO → UDRW"
          hdiutil convert "$DMG" -format UDRW -o "$RW_DMG" -ov
          echo "::endgroup::"

          echo "::group::Mount writable image"
          hdiutil attach "$RW_DMG" \
            -mountpoint "$MOUNT" \
            -nobrowse -noverify -noautoopen
          echo "::endgroup::"

          echo "::group::Install volume icon"
          cp "$ICON" "${MOUNT}/.VolumeIcon.icns"
          # 'C' = HasCustomIcon. Without this flag, Finder ignores the icns.
          SetFile -a C "$MOUNT"
          touch "$MOUNT" || true
          echo "::endgroup::"

          echo "::group::Detach writable image"
          # sync flushes the icon write before detach to avoid a race where
          # the file lands after the volume is gone.
          sync
          hdiutil detach "$MOUNT" -force
          echo "::endgroup::"

          echo "::group::Convert UDRW → UDZO (replace original)"
          hdiutil convert "$RW_DMG" -format UDZO -imagekey zlib-level=9 -o "$DMG" -ov
          echo "::endgroup::"

          echo "::group::Re-codesign DMG"
          # --force replaces the signature invalidated by the byte change.
          # --timestamp is required for notarization.
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$DMG"
          codesign --verify --verbose=2 "$DMG"
          echo "::endgroup::"

          echo "::group::Notarize (synchronous)"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          echo "::endgroup::"

          echo "::group::Staple notarization ticket"
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          echo "::endgroup::"

          echo "::notice::DMG volume icon installed and re-notarized: $DMG"

      # Tags shaped `vX.Y.Z-beta.N` ship to the beta channel; everything else
      # (`vX.Y.Z`) is a stable release. Downstream steps read this to flip the
      # `prerelease` flag and to decide whether to push the rolling beta
      # manifest. A prerelease is never GitHub's "latest", so stable users on
      # the /releases/latest/ endpoint are never offered a beta.
      - name: Detect channel from tag
        id: tagmeta
        run: |
          TAG="${GITHUB_REF##*/}"
          if [[ "$TAG" == *"-beta."* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # Build a short changelog from commit subjects between the previous
      # *stable* tag and this one. Both stable and beta releases diff against
      # the last stable so a beta shows the cumulative delta queued for the
      # next stable. `chore: bump version` commits are skipped (they mark the
      # release, not a change in it). Consumed by Stage (injected into
      # latest.json) and by Publish (the GitHub Release body).
      - name: Generate release notes
        id: notes
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF##*/}"

          PREV=$(git tag --list 'v*' --sort=-v:refname \
                  | grep -v -- '-beta\.' \
                  | grep -v -Fx "$TAG" \
                  | head -n1 || echo "")

          if [[ -z "$PREV" ]]; then
            BODY="Initial release."
          else
            COMMITS=$(git log "${PREV}..${TAG}" \
                        --no-merges \
                        --pretty=format:'- %s' \
                      | grep -v '^- chore: bump version' || true)
            if [[ -z "$COMMITS" ]]; then
              BODY="Maintenance release."
            else
              COMPARE="https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
              BODY=$(printf '%s\n\n**Full changelog:** %s' "$COMMITS" "$COMPARE")
            fi
          fi

          # GITHUB_OUTPUT's heredoc form is the only safe way to pass
          # newline-containing values to later steps.
          {
            echo "body<<NOTES_EOF"
            echo "$BODY"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "----- generated notes -----"
          echo "$BODY"
          echo "---------------------------"

      # Stage every release asset under dist/ so the publish step has one
      # place to look. Also generates latest.json (the updater manifest)
      # since we are no longer using tauri-action's publish flow.
      - name: Stage release assets
        id: stage
        env:
          # Pass the generated notes via env (not inlined in the script) so a
          # stray quote in a commit subject can't break the shell string.
          NOTES: ${{ steps.notes.outputs.body }}
        run: |
          set -euo pipefail
          BUNDLE=src-tauri/target/universal-apple-darwin/release/bundle
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          REPO="${{ github.repository }}"

          mkdir -p dist

          # Versioned dmg (kept for archive/audit purposes).
          cp "$BUNDLE/dmg/draw_${VERSION}_universal.dmg" "dist/draw_${VERSION}_universal.dmg"

          # Stable-named dmg — the marketing site uses this URL forever.
          cp "$BUNDLE/dmg/draw_${VERSION}_universal.dmg" "dist/draw.dmg"

          # Updater payload + minisign signature.
          cp "$BUNDLE/macos/draw.app.tar.gz"     "dist/draw.app.tar.gz"
          cp "$BUNDLE/macos/draw.app.tar.gz.sig" "dist/draw.app.tar.gz.sig"

          # Updater manifest. We point at the version-specific download URL
          # (not /latest/) so a client mid-update gets exactly the version
          # the manifest advertised, even if a newer release lands meanwhile.
          # Universal binary → both arches resolve to the same artifact.
          SIG=$(cat "$BUNDLE/macos/draw.app.tar.gz.sig")
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          UPDATER_URL="https://github.com/${REPO}/releases/download/v${VERSION}/draw.app.tar.gz"

          # jq (preinstalled on macos-latest) handles JSON escaping for the
          # multi-line notes so newlines/quotes/backslashes from commit
          # messages can't break the manifest. NOTES comes from the step env.
          jq -n \
            --arg version "${VERSION}" \
            --arg notes "$NOTES" \
            --arg pub_date "${PUB_DATE}" \
            --arg sig "${SIG}" \
            --arg url "${UPDATER_URL}" \
            '{
               version: $version,
               notes: $notes,
               pub_date: $pub_date,
               platforms: {
                 "darwin-x86_64":  { signature: $sig, url: $url },
                 "darwin-aarch64": { signature: $sig, url: $url }
               }
             }' > dist/latest.json

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          ls -la dist/

      # Two-step publish for GitHub's Immutable Releases: under that setting a
      # release freezes the moment it's published, so any in-flight asset
      # upload afterward fails. We create the release as a draft so softprops
      # can upload every asset, then flip the draft off in a separate step.
      # workflow_dispatch runs deliberately stop at the draft for human review.
      - name: Publish GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.stage.outputs.version }}
          name: draw v${{ steps.stage.outputs.version }}
          draft: true
          prerelease: ${{ steps.tagmeta.outputs.prerelease }}
          fail_on_unmatched_files: true
          body: |
            ${{ steps.notes.outputs.body }}

            ---

            Download `draw.dmg` below.

            **First launch on a clean Mac:** the app is signed and notarized,
            so it should open without warnings. If macOS still complains
            (e.g. because the file was downloaded via a non-browser tool),
            right-click the app → Open → Open.

            Existing users: the in-app updater will offer this version on
            the next launch.
          files: |
            dist/draw_${{ steps.stage.outputs.version }}_universal.dmg
            dist/draw.dmg
            dist/draw.app.tar.gz
            dist/draw.app.tar.gz.sig
            dist/latest.json

      # Flip the draft to published. Only runs for tag-push events;
      # workflow_dispatch runs stop at the draft above so a human can review
      # before publishing.
      - name: Publish draft (tag-push only)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "v${{ steps.stage.outputs.version }}" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false

      # Beta channel: publish the manifest to a dedicated `manifests` branch
      # served via raw.githubusercontent.com. This is forward-compatible
      # infrastructure — draw's in-app updater currently consumes only the
      # stable channel (releases/latest/.../latest.json), so nothing reads
      # beta.json yet. When a Beta/Stable toggle is added later, point a beta
      # endpoint at:
      #   https://raw.githubusercontent.com/<repo>/manifests/beta.json
      #
      # workflow_dispatch runs intentionally skip this push so a human can
      # review the draft release before the beta channel switches over.
      - name: Publish beta manifest to manifests branch
        if: steps.tagmeta.outputs.prerelease == 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          WORK=$(mktemp -d)
          git clone --quiet --depth 1 --branch manifests \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$WORK" 2>/dev/null || {
              # Branch doesn't exist yet — bootstrap as orphan.
              git clone --quiet --depth 1 \
                "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
                "$WORK"
              git -C "$WORK" switch --orphan manifests
              git -C "$WORK" rm -rf . >/dev/null 2>&1 || true
            }
          cp dist/latest.json "$WORK/beta.json"
          git -C "$WORK" config user.name  "github-actions[bot]"
          git -C "$WORK" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$WORK" add beta.json
          if git -C "$WORK" diff --cached --quiet; then
            echo "beta.json unchanged; nothing to push"
          else
            git -C "$WORK" commit -m "release: beta manifest for v${{ steps.stage.outputs.version }}"
            git -C "$WORK" push origin manifests
          fi
