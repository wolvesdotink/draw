<?xml version="1.0" encoding="UTF-8"?>
<!--
  draw app icon — full-bleed variant for systems that mask icons.

  Same mark as icon.svg, but a solid black square instead of a squircle.
  iOS and macOS Tahoe (26+) apply their own continuous-curve mask to app
  icons; supplying a squircle source produces a double-mask effect where
  the system's mask shows glass / wallpaper through the SVG's transparent
  corners, appearing as a grey border around a smaller squircle.
  A full-bleed square lets the system's mask define the shape cleanly.

  Used by generate-icons.sh as the source for:
    - macOS bundle PNGs (32x32, 128x128, 128x128@2x), icon.icns, icon.png
    - iOS appiconset PNGs (ios/AppIcon-*.png + Contents.json)

  The squircle master at icon.svg still drives the Windows .ico and the
  Square*Logo.png / StoreLogo.png tile assets, plus android/**. Both
  sources are passed through `pnpm tauri icon` (see generate-icons.sh)
  so the outputs are RGBA where Tauri requires it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" shape-rendering="geometricPrecision">
  <rect width="1024" height="1024" fill="#000000"/>
  <g transform="translate(512 512) rotate(45)">
    <path d="M -320 -75 L 120 -75 L 290 0 L 120 75 L -320 75 Z" fill="#FFFFFF"/>
    <rect x="-240" y="-7" width="440" height="14" fill="#000000"/>
    <path d="M -320 -75 L -260 -30 L -260 30 L -320 75 Z" fill="#000000"/>
    <circle cx="285" cy="0" r="9" fill="#000000"/>
  </g>
  <rect x="722" y="688" width="220" height="60" fill="#FFFFFF"/>
</svg>
